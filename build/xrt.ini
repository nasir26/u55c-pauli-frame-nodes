# stim-u55c XRT runtime configuration.
#
# Minimal bring-up config: console logging at "info" so host/xrt_runner.cpp
# failures (bad xclbin, buffer allocation, kernel hang) show up without
# needing --verbose on the host binary itself. No profiling/trace enabled
# by default -- that adds overhead and isn't needed until Mode A/B
# benchmarking (Phase 4/5, bench/) actually needs it.

[Runtime]
runtime_log=console

[Debug]
native_xrt_trace=false
