name: tests

# Runs on the CPU only; no FPGA, card or Vitis install is needed. Covers:
#   soft model against Stim (tests/test_softmodel_validation.py),
#   the first kernel in C simulation against its model, compiled with g++ and kernel/ap_uint_shim.hpp
#   (tests/test_kernel_tier2.py, tests/test_kernel_unit_testbenches.py),
#   the batch kernel's program format, schedule checks and rates against Stim, Threefry known answers and the
#   comparison with randomgen (tests/test_batch_kernel.py, tests/test_threefry.py).
# The batch kernel's C simulation needs the Vitis HLS headers (ap_int.h, hls_stream.h); without them those tests are
# reported as skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt "stim==1.13.0" randomgen
      - run: g++ --version
      - run: pytest -v -rs
